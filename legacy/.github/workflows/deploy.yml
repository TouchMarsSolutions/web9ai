# NOT WIRED. GitHub runs only workflows under the repo-root .github/workflows/, so this file never runs.
# Kept as the record of how the Docusaurus site was published to the gh-pages branch (GitHub Pages,
# custom domain www.web9.ai). legacy/ cannot rebuild the live site: its static assets moved to public/.
# The fallback during the EmDash cutover is the already-built gh-pages branch (spec §9), never a rebuild
# from legacy/. The complete Docusaurus source is the tag docusaurus-final. A deploy without static/CNAME in the output would unbind www.web9.ai from Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    # permissions:
    #   deployments: write
    #   contents: write
    #   statuses: write
    #   actions: write
    #   checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build website
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com